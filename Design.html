<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
        }

        body {
            background-color: rgb(113, 49, 177);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        h2, h3 {
            text-align: center;
            padding: 15px;
        }

        #uploadArea {
            text-align: center;
            margin: 20px 0;
        }

        #imageInput {
            padding: 10px;
            background: white;
            color: black;
            border-radius: 6px;
            cursor: pointer;
        }

        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            margin: 0 20px 40px 20px;
        }

        .gallery-item {
            position: relative;
        }

        .gallery-item img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid white;
            display: block;
        }

        .gallery-item .filename {
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            word-break: break-all;
        }
    </style>
<h3 id="back"><a href="index.html">Back to Portfolio</a></h3>

    <h2>My Designs</h2>

    <div id="uploadArea">
        <input type="file" id="imageInput" accept="image/*" multiple>
    </div>

    <div id="gallery"></div>
    <div id="lightbox">
        <span id="lightboxClose">&times;</span>
        <img id="lightboxImg" src="" alt="Full size preview">
    </div>
    <script src="script.js"></script>
</body>
</html>
