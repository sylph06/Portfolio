<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
        }
        body {
            background-color: rgb(113, 49, 177);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        h2, h3 {
            text-align: center;
            padding: 15px;
        }
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            margin: 0 20px 40px 20px;
        }
        .gallery-item {
            position: relative;
        }
        .gallery-item img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid white;
            display: block;
        }
        .gallery-item .filename {
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            word-break: break-all;
        }
        .pdf-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }
        .pdf-item .pdf-icon {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 8px;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: rgb(113, 49, 177);
            font-weight: bold;
        }
        .img-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }
    </style>
<h3 id="back"><a href="index.html">Back to Portfolio</a></h3>
    <h2>My Designs</h2>
    <div id="gallery">
        <a class="gallery-item pdf-item" href="Borquillo-Lab-Act1(2).pdf" target="_blank" rel="noopener noreferrer">
            <div class="pdf-icon">PDF</div>
            <div class="filename">Borquillo-Lab-Act1(2).pdf</div>
        </a>
        <a class="gallery-item pdf-item" href="Borquillo-Lab1.pdf" target="_blank" rel="noopener noreferrer">
            <div class="pdf-icon">PDF</div>
            <div class="filename">Borquillo-Lab1.pdf</div>
        </a>
        <a class="gallery-item img-item" href="Quiz1.png" target="_blank" rel="noopener noreferrer">
            <img src="Quiz1.png" alt="Quiz1">
            <div class="filename">Quiz1.png</div>
        </a>
        <a class="gallery-item img-item" href="Quiz2.png" target="_blank" rel="noopener noreferrer">
            <img src="Quiz2.png" alt="Quiz2">
            <div class="filename">Quiz2.png</div>
        </a>
        <a class="gallery-item img-item" href="Quiz3.png" target="_blank" rel="noopener noreferrer">
            <img src="Quiz3.png" alt="Quiz3">
            <div class="filename">Quiz3.png</div>
        </a>
        <a class="gallery-item img-item" href="Long Quiz.png" target="_blank" rel="noopener noreferrer">
            <img src="Long Quiz.png" alt="Long Quiz">
            <div class="filename">Long Quiz.png</div>
        </a>
        <a class="gallery-item img-item" href="Lab 1.png" target="_blank" rel="noopener noreferrer">
            <img src="Lab 1.png" alt="Lab 1">
            <div class="filename">Lab 1.png</div>
        </a>
        <a class="gallery-item img-item" href="Lab 2.png" target="_blank" rel="noopener noreferrer">
            <img src="Lab 2.png" alt="Lab 2">
            <div class="filename">Lab 2.png</div>
        </a>
         <a class="gallery-item img-item" href="Prelim_exam.jpg" target="_blank" rel="noopener noreferrer">
            <img src="Prelim_exam.jpg" alt="Prelim_exam">
            <div class="filename">Prelim_exam.jpg</div>
    </div>
    <div id="lightbox">
        <span id="lightboxClose">&times;</span>
        <img id="lightboxImg" src="" alt="Full size preview">
    </div>
    <script src="script.js"></script>
</body>
</html>
